name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
          ESP32_CONNECTION_TYPE: mock
          DATABASE_URL: "sqlite+aiosqlite:///./data/robot.db"
        run: |
          python -m pytest tests/ -v --tb=short --cov=app --cov=hardware --cov-report=term-missing

      - name: Run type checks
        working-directory: backend
        run: |
          python -m mypy app/ hardware/ --ignore-missing-imports || true

      - name: Run linter
        working-directory: backend
        run: |
          python -m ruff check app/ hardware/ tests/ || true

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run frontend type check
        working-directory: frontend
        run: npx tsc --noEmit || true

      - name: Run frontend tests
        working-directory: frontend
        run: npm test || true
